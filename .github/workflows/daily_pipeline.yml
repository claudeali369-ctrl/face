name: FACE Daily Pipeline

on:
  schedule:
    - cron: "0 3,7,14 * * *"
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Publish all ready items immediately; may publish several items at once."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  run-pipeline:
    name: Run FACE Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONPATH: ${{ github.workspace }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      FACE_PUBLISH_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_now || false }}

    steps:
      # ── Step 1: Checkout repository ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Step 2: Set up Python 3.11 ────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Step 3: Cache pip packages ────────────────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-

      # ── Step 4: Install system dependencies ──────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ffmpeg \
            libsm6 \
            libxext6 \
            libfontconfig1 \
            libglib2.0-0 \
            libgl1 \
            libglx-mesa0 \
            fonts-noto \
            fonts-noto-extra

      # ── Step 5: Install Python dependencies ──────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── Step 6: Cache FACE assets (fonts, audio — never re-download) ─────
      - name: Cache FACE assets
        uses: actions/cache@v4
        with:
          path: assets/
          key: face-assets-${{ hashFiles('config.yml') }}
          restore-keys: |
            face-assets-

      # ── Step 7: Restore state from state branch ───────────────────────────
      - name: Restore state from state branch
        run: |
          git fetch origin state:state 2>/dev/null || true
          git checkout state -- state/ 2>/dev/null || mkdir -p state
          mkdir -p state/logs state/.locks state/prompt_versions state/schema
          echo "State restored or initialized."

      # ── Step 8: Run TrendHunterAgent ─────────────────────────────────────
      - name: Run TrendHunterAgent
        run: python agents/trend_hunter.py

      # ── Step 9: Run ContentStrategyAgent ─────────────────────────────────
      - name: Run ContentStrategyAgent
        run: python agents/content_strategy.py

      # ── Step 10: Run ContentGeneratorAgent ───────────────────────────────
      - name: Run ContentGeneratorAgent
        run: python agents/content_generator.py

      # ── Step 11: Run VisualDirectorAgent ──────────────────────────────────
      - name: Check image-provider configuration
        run: |
          if [[ -z "$POLLINATIONS_API_KEY" ]]; then
            echo "::warning::POLLINATIONS_API_KEY is empty; Pollinations will be skipped without sending a request."
          else
            python - <<'PY'
          import json, os, requests
          key = os.environ.get("POLLINATIONS_API_KEY", "").strip()
          try:
              response = requests.get(
                  "https://gen.pollinations.ai/account/key",
                  headers={"Authorization": f"Bearer {key}", "Accept": "application/json"},
                  timeout=15,
              )
              if response.status_code == 200:
                  data = response.json()
                  if data.get("valid") is not True:
                      print("::warning::Pollinations API key endpoint did not report this key as valid; Pollinations will be skipped.")
                      with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                          env.write("POLLINATIONS_API_DISABLED=true\n")
                  elif data.get("type") != "secret":
                      print("::warning::Pollinations key is not a server-side secret key. Use an sk_ secret key for GitHub Actions; Pollinations will be skipped.")
                      with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                          env.write("POLLINATIONS_API_DISABLED=true\n")
                  else:
                      print("Pollinations server-side secret key validated using the non-generation account/key endpoint.")
              elif response.status_code == 401:
                  print("::warning::Pollinations returned HTTP 401 for the configured key; skipping Pollinations this run.")
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                      env.write("POLLINATIONS_API_DISABLED=true\n")
              elif response.status_code == 402:
                  print("::warning::Pollinations API reports HTTP 402; account/key budget is unavailable, so no image-generation requests will be sent this run.")
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                      env.write("POLLINATIONS_API_DISABLED=true\n")
              elif response.status_code == 403:
                  print("::warning::Pollinations key validation endpoint denied metadata access (403); this does not prove image generation is forbidden, so the image provider will validate its own request.")
              else:
                  print(f"::warning::Pollinations key preflight returned HTTP {response.status_code}; continuing, and generation will report any provider-specific error.")
          except (requests.RequestException, ValueError) as exc:
              print(f"::warning::Could not verify Pollinations key without generating an image: {exc}")
          PY
          fi
          if [[ -z "$PIXABAY_API_KEY" ]]; then
            echo "::warning::PIXABAY_API_KEY is empty; Pixabay fallback is disabled."
          fi
      - name: Run VisualDirectorAgent
        run: python agents/visual_director.py

      # ── Step 12: Check if reels are scheduled today ───────────────────────
      - name: Check if reels are scheduled today
        id: check-reels
        run: |
          python - <<'EOF'
          import json, os, sys
          try:
              with open('state/content_plan.json') as f:
                  plan = json.load(f)
              reels = [r for r in plan.get('reels', []) if r]
              result = 'true' if reels else 'false'
          except (FileNotFoundError, json.JSONDecodeError, KeyError):
              result = 'false'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'HAS_REELS={result}\n')
          print(f'HAS_REELS={result}')
          EOF

      # ── Step 13: Run ReelProducerAgent (only if reels exist) ──────────────
      - name: Run ReelProducerAgent
        if: env.HAS_REELS == 'true'
        run: python agents/reel_producer.py

      # ── Step 14: Run PublisherAgent ───────────────────────────────────────
      # NOTE: publisher.py exits 0 on token expiry — this is intentional.
      - name: Run PublisherAgent
        run: python agents/publisher.py

      
      # Step 15: Save state on top of the state branch
      - name: Commit state back to state branch
        run: |
          set -euo pipefail

          git config user.name "FACE Bot"
          git config user.email "face-bot@github-actions"

          STATE_WORKTREE="$RUNNER_TEMP/face-state"

          # Use the existing state branch as the commit parent.
          # On the first run, fall back to the current commit.
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin +refs/heads/state:refs/remotes/origin/state
            STATE_BASE="refs/remotes/origin/state"
          else
            STATE_BASE="HEAD"
          fi

          # Create an isolated checkout so main remains untouched.
          git worktree add --detach "$STATE_WORKTREE" "$STATE_BASE"

          # Copy the latest generated state, including file deletions.
          rm -rf "$STATE_WORKTREE/state"
          mkdir -p "$STATE_WORKTREE/state"
          cp -a state/. "$STATE_WORKTREE/state/"

          # Temporary downloaded media is a runtime artifact, not durable agent state.
          # Excluding it keeps binary images out of the state branch and its Git history.
          rm -rf "$STATE_WORKTREE/state/temp"

          git -C "$STATE_WORKTREE" config user.name "FACE Bot"
          git -C "$STATE_WORKTREE" config user.email "face-bot@github-actions"
          git -C "$STATE_WORKTREE" add -A state/

          if git -C "$STATE_WORKTREE" diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git -C "$STATE_WORKTREE" commit \
              -m "state: $(date -u +%Y-%m-%d_%H:%M) daily pipeline"

            git -C "$STATE_WORKTREE" push origin HEAD:state
            echo "State committed and pushed successfully."
          fi


      
      # Validate publishing results without failing for partial item failures.
      - name: Validate PublisherAgent results
        if: success()
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path("state/publish_log.json")
          if not path.is_file():
              print("::error::PublisherAgent did not write state/publish_log.json")
              sys.exit(1)

          try:
              report = json.loads(path.read_text(encoding="utf-8"))
              failed = int(report.get("failed_count", 0))
              published = int(report.get("published_count", 0))
              expected_run_id = os.environ.get("GITHUB_RUN_ID", "")
              report_run_id = str(report.get("github_run_id", ""))
          except (OSError, ValueError, TypeError) as exc:
              print(f"::error::Could not validate publisher report: {exc}")
              sys.exit(1)

          if not expected_run_id or report_run_id != expected_run_id:
              print("::error::Publisher report is missing or belongs to a different workflow run.")
              sys.exit(1)

          print(f"Publisher outcome for run {report_run_id}: published={published}, failed={failed}")

          if failed:
              print(
                  f"::warning::PublisherAgent reported {failed} failed item(s). "
                  "See state/errors.json and the job log."
              )
          PY


      # ── Step 16: Clean up large temp files ───────────────────────────────
      - name: Clean up temp files
        if: always()
        run: |
          rm -rf assets/videos/clips/temp_* 2>/dev/null || true
          rm -rf assets/audio/temp/ 2>/dev/null || true
          find assets/images/raw -name "*.jpg" -delete 2>/dev/null || true
          find assets/images/approved -name "*.jpg" -delete 2>/dev/null || true
          echo "Cleanup complete."
